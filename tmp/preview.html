<!DOCTYPE html>
<html>
<head>
<style>
  body { background: #1a1a1a; color: #ccc; font-family: system-ui; margin: 0; padding: 40px; }
  h1 { text-align: center; margin-bottom: 40px; }
  .grid { display: flex; gap: 40px; justify-content: center; flex-wrap: wrap; }
  .card { text-align: center; }
  .card img { width: 256px; height: 256px; border-radius: 40px; }
  .card p { margin-top: 12px; font-size: 14px; }
</style>
</head>
<body>
  <h1>Notchy Icon Concepts</h1>
  <div class="grid">
    <div class="card">
      <img src="icon-concept-a.svg">
      <p><strong>A: Amber N</strong><br>Glowing "N" on ink background</p>
    </div>
    <div class="card">
      <img src="icon-concept-b.svg">
      <p><strong>B: VFD Block</strong><br>The ▮ brand mark as icon</p>
    </div>
    <div class="card">
      <img src="icon-concept-c.svg">
      <p><strong>C: Segmented Meter</strong><br>VFD progress bar motif</p>
    </div>
  </div>
</body>
</html>
