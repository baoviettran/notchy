<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <rect width="1024" height="1024" rx="200" fill="#14110C"/>
  <defs>
    <filter id="g" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12"/>
    </filter>
  </defs>
  <!-- segmented VFD meter: 3 lit segments with glow -->
  <g>
    <rect x="312" y="432" width="100" height="160" rx="6" fill="#FFB454" opacity="0.3" filter="url(#g)"/>
    <rect x="312" y="432" width="100" height="160" rx="6" fill="#FFB454"/>
    <rect x="462" y="432" width="100" height="160" rx="6" fill="#FFB454" opacity="0.3" filter="url(#g)"/>
    <rect x="462" y="432" width="100" height="160" rx="6" fill="#FFB454"/>
    <rect x="612" y="432" width="100" height="160" rx="6" fill="#FFB454" opacity="0.3" filter="url(#g)"/>
    <rect x="612" y="432" width="100" height="160" rx="6" fill="#FFB454"/>
  </g>
  <!-- dim unlit segments -->
  <rect x="312" y="432" width="100" height="160" rx="6" fill="none" stroke="#807763" stroke-width="2" opacity="0.3"/>
  <rect x="462" y="432" width="100" height="160" rx="6" fill="none" stroke="#807763" stroke-width="2" opacity="0.3"/>
  <rect x="612" y="432" width="100" height="160" rx="6" fill="none" stroke="#807763" stroke-width="2" opacity="0.3"/>
</svg>
