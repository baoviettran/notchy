[package]
name = "notchy"
version = "0.2.0"
description = "A local-first personal finance application"
authors = ["hoangtu34"]
license = "MIT"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "notchy_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.2.0", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.5.0", features = ["tray-icon"] }
tauri-plugin-log = "2.0.0-rc"
tauri-plugin-fs = "2.2.0"
tauri-plugin-dialog = "2.2.0"
tauri-plugin-global-shortcut = "2"
tauri-plugin-opener = "2.5.0"
tauri-plugin-single-instance = "2"
rusqlite = { version = "0.32", features = ["bundled", "backup"] }
fs2 = "0.4"
tokio = { version = "1", features = ["sync", "rt", "macros", "time"] }
ulid = { version = "3", features = ["serde"] }
blake3 = "1"
thiserror = "2"
ts-rs = { version = "12", features = ["serde-compat", "no-serde-warnings"] }

[dev-dependencies]
tauri = { version = "2.5.0", features = ["test"] }
