name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/cache@v5
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Compile i18n messages
        run: pnpm exec paraglide-js compile --project ./project.inlang --outdir ./src/lib/paraglide

      - name: Type check
        run: pnpm check

      - name: Unit tests
        run: pnpm test

      # The gate that ran nowhere: it is what caught this phase's own spec
      # carrying no `Serves: STORY-0xx` trace. Note the exit code is driven by
      # that check alone — per-plan staleness does not affect it, so this step
      # does not fail on a stale rollup.
      - name: Roadmap traces are current
        run: pnpm test:roadmap

      - name: Coverage gate (touched files)
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          pnpm test:coverage
          # GitHub's pull_request.base.sha can be STALE: an older main tip than
          # where this branch actually diverged. The gate diffs HEAD against that
          # base, which sweeps main's own commits into this PR and fails floors on
          # files it never touched (e.g. DatePicker.svelte). For PR builds, diff
          # against the live base-branch tip so only this PR's own changes are
          # checked. Push-to-main builds keep BASE_SHA (github.event.before) to
          # re-check the just-merged changes. Falls back to BASE_SHA if origin/main
          # can't be resolved.
          if [ -n "${{ github.event.pull_request.number }}" ]; then
            git fetch origin main --quiet 2>/dev/null || true
            EFFECTIVE_BASE="$(git merge-base HEAD origin/main 2>/dev/null || echo "$BASE_SHA")"
          else
            EFFECTIVE_BASE="$BASE_SHA"
          fi
          BASE_SHA="$EFFECTIVE_BASE" node scripts/coverage-gate.mjs

      - name: Web build
        run: pnpm build

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libappindicator3-dev librsvg2-dev patchelf

      # `--all-targets`: without it clippy lints only lib+bins, so every
      # integration test under tests/ shipped unlinted. Widened after
      # `--all-targets -- -D warnings` was found to exit 101 on main (four
      # dead-code items plus one int_plus_one); it is green now, and this step
      # is what keeps it that way.
      - name: Clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      # `pnpm check:db-contracts`, spelled out: this job has the Rust toolchain
      # and the webkit deps the bindings binary needs to compile, and no pnpm.
      # Gate 2's exhaustiveness is typed against the *generated* union, so a
      # Rust ErrorCode added without regenerating leaves the build green and the
      # new code falling through — this is the only step that catches that.
      - name: Bindings are current
        run: cargo run --manifest-path src-tauri/Cargo.toml --bin export_bindings -- --check

  e2e:
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/cache@v5
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Compile i18n messages
        run: pnpm exec paraglide-js compile --project ./project.inlang --outdir ./src/lib/paraglide

      - name: Install Playwright chromium
        run: npx playwright install --with-deps chromium

      - name: E2E tests
        run: pnpm test:e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
